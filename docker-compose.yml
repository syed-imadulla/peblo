version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: peblo_user
      POSTGRES_PASSWORD: peblo_password
      POSTGRES_DB: peblo_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo_user -d peblo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./backend
    environment:
      - DATABASE_URL=postgresql://peblo_user:peblo_password@db/peblo_db
      - JWT_SECRET=super_secret_for_development_only_123
      - DATA_DIR=/app/data
      - ASSETS_DIR=/app/assets
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app/data
      - ./docs/challenge/assets:/app/assets
    depends_on:
      db:
        condition: service_healthy

  cms:
    build:
      context: ./cms
    ports:
      - "3000:80"
    depends_on:
      - api

  viewer:
    build:
      context: ./viewer
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  db_data:
  api_data:
