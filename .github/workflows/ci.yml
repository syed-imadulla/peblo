name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          cd backend
          pytest tests/

  viewer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json
      - name: Install dependencies
        run: |
          cd viewer
          npm ci
      - name: Run tests
        run: |
          cd viewer
          npm run test -- --run

  cms-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: cms/package-lock.json
      - name: Install dependencies
        run: |
          cd cms
          npm ci
      - name: Build CMS
        run: |
          cd cms
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, viewer-test, cms-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -t peblo-backend:latest ./backend
      - name: Build CMS Image
        run: docker build -t peblo-cms:latest ./cms
      - name: Build Viewer Image
        run: docker build -t peblo-viewer:latest ./viewer
      - name: Deploy Placeholder
        run: echo "Deployment would push images to ECR/GAR and update ECS/K8s manifests"
